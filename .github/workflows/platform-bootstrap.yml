name: Platform Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Provision Jenkins Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      # Allow OIDC role assumption when vars.AWS_OIDC_ROLE_ARN is configured;
      # static keys remain the fallback when the var is unset.
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Export Environment Aliases
        run: |
          chmod +x scripts/lib/env-aliases.sh scripts/export-github-env.sh
          source scripts/lib/env-aliases.sh
          bash scripts/export-github-env.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # Prefer OIDC role assumption when configured; fall back to static keys.
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.8.5

      - name: Make Scripts Executable
        run: chmod +x infrastructure/terraform/scripts/*.sh

      - name: Bootstrap Terraform Backend
        run: infrastructure/terraform/scripts/bootstrap-terraform-backend.sh

      - name: Generate terraform.tfvars
        run: infrastructure/terraform/scripts/generate-terraform-tfvars.sh

      - name: Terraform Init
        run: infrastructure/terraform/scripts/terraform-init.sh

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        run: infrastructure/terraform/scripts/terraform-plan.sh

      - name: Terraform Apply
        run: infrastructure/terraform/scripts/terraform-apply.sh

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f infrastructure/terraform/terraform.tfvars
