name: Environment Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  validate-env:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Make Script Executable
        run: chmod +x scripts/discover-env-vars.sh

      - name: Run Environment Discovery
        run: ./scripts/discover-env-vars.sh

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=v8.18.0
          # Release asset embeds the version without the leading "v".
          GITLEAKS_ASSET="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${GITLEAKS_ASSET}"
          tar -xzf "${GITLEAKS_ASSET}"
          sudo mv gitleaks /usr/local/bin/

      - name: Scan For Hardcoded Secrets
        # Run the binary directly with --exit-code 1 so findings fail the build
        # and block the PR instead of silently passing.
        run: gitleaks detect --source . --verbose --redact --exit-code 1
