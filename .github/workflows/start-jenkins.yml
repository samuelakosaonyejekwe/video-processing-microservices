name: Start Jenkins

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  APP_ENV: ${{ vars.APP_ENV }}
  JENKINS_ASG_NAME: ${{ vars.JENKINS_ASG_NAME }}

jobs:
  start:
    name: Start Jenkins
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Environment Aliases
        run: |
          chmod +x scripts/lib/env-aliases.sh scripts/export-github-env.sh
          source scripts/lib/env-aliases.sh
          bash scripts/export-github-env.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start Jenkins
        run: |
          chmod +x scripts/start-jenkins.sh
          bash scripts/start-jenkins.sh
