name: Reusable Security Workflow

on:
  workflow_call:

jobs:

  reusable-security-scan:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Filesystem Scan
        # Pinned to a SHA. NOTE: the previous "0.20.0" tag was removed upstream
        # (trivy-action migrated to "vX.Y.Z" tags), so this is pinned to v0.28.0.
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: security/trivy/trivy.yaml
          trivyignores: security/trivy/ignore.yaml
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: config
          scan-ref: infrastructure/
          trivy-config: security/trivy/trivy.yaml
          trivyignores: security/trivy/ignore.yaml
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=v8.18.0
          wget -q https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_linux_x64.tar.gz
          tar -xzf gitleaks_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose
