name: Reusable Test Workflow

on:
  workflow_call:

    inputs:

      python_version:
        required: false
        type: string
        default: "3.12"

jobs:

  reusable-python-tests:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set Up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Testing Dependencies
        run: |
          pip install \
            pytest \
            pytest-cov \
            black \
            flake8 \
            pylint \
            mypy

      - name: Run Black
        run: black --check services scripts

      - name: Run Flake8
        run: flake8 services scripts

      - name: Run Pytest
        run: |
          for service in gateway auth converter notification; do
            pip install -r services/$service/requirements.txt
            (cd services/$service && pytest)
          done
          pytest tests
