name: Reusable Test Workflow

on:
  workflow_call:

    inputs:

      python_version:
        required: false
        type: string
        default: "3.12"

jobs:

  reusable-python-tests:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Testing Dependencies
        run: |
          pip install \
            pytest \
            pytest-cov \
            black \
            flake8 \
            pylint \
            mypy

      - name: Run Black
        run: |
          black --check .

      - name: Run Flake8
        run: |
          flake8 .

      - name: Run Pylint
        run: |
          pylint .

      - name: Run Mypy
        run: |
          mypy .

      - name: Run Pytest
        run: |
          pytest --cov=.