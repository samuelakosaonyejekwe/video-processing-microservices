name: Docker Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  # Allow OIDC role assumption when vars.AWS_OIDC_ROLE_ARN is configured;
  # static keys remain the fallback when the var is unset.
  id-token: write

env:
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:

  docker-build:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Required Credentials
        env:
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          PROJECT_NAME_VALUE: ${{ vars.PROJECT_NAME }}
        run: |
          test -n "${AWS_REGION_VALUE}"
          test -n "${PROJECT_NAME_VALUE}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # Prefer OIDC role assumption when configured; fall back to static keys.
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Login to DockerHub
        if: vars.PUSH_DOCKER_HUB == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          PUSH_DOCKER_HUB: ${{ vars.PUSH_DOCKER_HUB }}
        run: |
          chmod +x scripts/publish-docker-images.sh scripts/lib/env-aliases.sh
          bash scripts/publish-docker-images.sh

      - name: Deployment Summary
        run: |
          echo "Docker images built and pushed to ECR."
          echo "Images tagged with latest and ${IMAGE_TAG}"
          echo "Deploy EKS Services starts automatically after this workflow completes on main."
          echo "Manual deploy: gh workflow run \"Deploy EKS Services\" --ref main -f image_tag=${IMAGE_TAG}"
