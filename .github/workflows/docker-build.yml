name: Docker Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:

  docker-build:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Credentials
        run: |
          test -n "${{ vars.AWS_REGION }}"
          test -n "${{ vars.PROJECT_NAME }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: vars.PUSH_DOCKER_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          PUSH_DOCKER_HUB: ${{ vars.PUSH_DOCKER_HUB }}
        run: |
          chmod +x scripts/publish-docker-images.sh scripts/lib/env-aliases.sh
          bash scripts/publish-docker-images.sh

      - name: Deployment Summary
        run: |
          echo "Docker images built and pushed to ECR."
          echo "Images tagged with latest and ${IMAGE_TAG}"
          echo "Deploy with the same tag: gh workflow run \"Deploy EKS Services\" --ref main -f image_tag=${IMAGE_TAG}"
