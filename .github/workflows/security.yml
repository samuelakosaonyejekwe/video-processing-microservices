name: Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  trivy-fs-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
          trivy --version

      - name: Run Trivy Filesystem Scan
        run: |
          mkdir -p security/trivy/reports
          trivy fs . \
            --ignorefile security/trivy/.trivyignore \
            --skip-dirs .compose-secrets,.git,.venv,.terraform \
            --skip-files jwt-private.pem,jwt-public.pem \
            --format sarif \
            --output security/trivy/reports/trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1
          trivy fs . \
            --ignorefile security/trivy/.trivyignore \
            --skip-dirs .compose-secrets,.git,.venv,.terraform \
            --skip-files jwt-private.pem,jwt-public.pem \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security/trivy/reports/trivy-fs.sarif
          category: trivy-filesystem

  trivy-iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
          trivy --version

      - name: Run Trivy IaC Scan
        run: |
          # Scan first-party IaC only. Pinned third-party registry modules
          # (e.g. terraform-aws-modules/eks) are vendored code we don't edit;
          # their inputs are hardened via our tfvars/module calls instead.
          trivy config infrastructure/ \
            --tf-exclude-downloaded-modules \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1

  trivy-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trivy-fs-scan]

    strategy:
      matrix:
        service: [gateway, auth, converter, notification, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
          trivy --version

      - name: Build service image
        run: |
          for attempt in 1 2 3; do
            docker build \
              -t scan-${{ matrix.service }}:ci \
              -f services/${{ matrix.service }}/Dockerfile . && break
            echo "Build attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done

      - name: Run Trivy Image Scan
        run: |
          mkdir -p security/trivy/reports
          trivy image scan-${{ matrix.service }}:ci \
            --ignorefile security/trivy/.trivyignore \
            --format sarif \
            --output security/trivy/reports/trivy-${{ matrix.service }}.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0
          trivy image scan-${{ matrix.service }}:ci \
            --ignorefile security/trivy/.trivyignore \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security/trivy/reports/trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
