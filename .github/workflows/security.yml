name: Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  trivy-fs-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.1

      - name: Run Trivy Filesystem Scan
        run: |
          mkdir -p security/trivy/reports
          trivy fs . \
            --config security/trivy/trivy.yaml \
            --ignorefile security/trivy/ignore.yaml \
            --format sarif \
            --output security/trivy/reports/trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security/trivy/reports/trivy-fs.sarif
          category: trivy-filesystem

  trivy-iac-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.1

      - name: Run Trivy IaC Scan
        run: |
          trivy config infrastructure/ \
            --config security/trivy/trivy.yaml \
            --ignorefile security/trivy/ignore.yaml \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

  trivy-image-scan:
    runs-on: ubuntu-latest
    needs: [trivy-fs-scan]

    strategy:
      matrix:
        service: [gateway, auth, converter, notification]

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.1

      - name: Build service image
        run: |
          docker build \
            -t scan-${{ matrix.service }}:ci \
            -f services/${{ matrix.service }}/Dockerfile .

      - name: Run Trivy Image Scan
        run: |
          mkdir -p security/trivy/reports
          trivy image scan-${{ matrix.service }}:ci \
            --config security/trivy/trivy.yaml \
            --ignorefile security/trivy/ignore.yaml \
            --format sarif \
            --output security/trivy/reports/trivy-${{ matrix.service }}.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security/trivy/reports/trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
