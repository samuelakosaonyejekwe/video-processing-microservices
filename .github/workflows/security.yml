name: Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  trivy-fs-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
          trivy --version

      - name: Run Trivy Filesystem Scan
        run: |
          mkdir -p security/trivy/reports
          trivy fs . \
            --ignorefile security/trivy/.trivyignore \
            --skip-dirs .compose-secrets,.git,.venv,.terraform \
            --skip-files jwt-private.pem,jwt-public.pem \
            --format sarif \
            --output security/trivy/reports/trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1
          trivy fs . \
            --ignorefile security/trivy/.trivyignore \
            --skip-dirs .compose-secrets,.git,.venv,.terraform \
            --skip-files jwt-private.pem,jwt-public.pem \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
        if: always()
        with:
          sarif_file: security/trivy/reports/trivy-fs.sarif
          category: trivy-filesystem

  trivy-iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
          trivy --version

      - name: Run Trivy IaC Scan
        run: |
          # Scan first-party IaC only. Pinned third-party registry modules
          # (e.g. terraform-aws-modules/eks) are vendored code we don't edit;
          # their inputs are hardened via our tfvars/module calls instead.
          trivy config infrastructure/ \
            --tf-exclude-downloaded-modules \
            --ignorefile security/trivy/.trivyignore \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1

  trivy-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trivy-fs-scan]

    strategy:
      matrix:
        service: [gateway, auth, converter, notification, frontend]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
          trivy --version

      # Authenticated DockerHub login keeps base-image pulls resilient against
      # anonymous rate limits. Only attempt the login when credentials are
      # configured; when they are, a failure is fatal so the scan never silently
      # falls back to an unauthenticated, rate-limited pull.
      - name: Login to DockerHub
        if: vars.DOCKER_USERNAME != ''
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build service image
        run: |
          built=false
          for attempt in 1 2 3; do
            if docker build \
              -t scan-${{ matrix.service }}:ci \
              -f services/${{ matrix.service }}/Dockerfile .; then
              built=true
              break
            fi
            echo "Build attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          if [ "${built}" != "true" ]; then
            echo "All build attempts failed for ${{ matrix.service }}"
            exit 1
          fi

      - name: Run Trivy Image Scan
        run: |
          mkdir -p security/trivy/reports
          trivy image scan-${{ matrix.service }}:ci \
            --ignorefile security/trivy/.trivyignore \
            --format sarif \
            --output security/trivy/reports/trivy-${{ matrix.service }}.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0
          trivy image scan-${{ matrix.service }}:ci \
            --ignorefile security/trivy/.trivyignore \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1

      - name: Generate SBOM
        run: |
          mkdir -p security/trivy/reports
          trivy image scan-${{ matrix.service }}:ci \
            --format cyclonedx \
            --output security/trivy/reports/sbom-${{ matrix.service }}.cdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: sbom-${{ matrix.service }}
          path: security/trivy/reports/sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: ignore

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
        if: always()
        with:
          sarif_file: security/trivy/reports/trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=v8.18.0
          # Release asset embeds the version without the leading "v".
          GITLEAKS_ASSET="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${GITLEAKS_ASSET}"
          tar -xzf "${GITLEAKS_ASSET}"
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        # Run the binary directly with --exit-code 1 so any finding fails the
        # build and blocks the PR (the marketplace action defaulted to a
        # non-blocking exit code for pull_request events).
        run: gitleaks detect --source . --verbose --redact --exit-code 1
