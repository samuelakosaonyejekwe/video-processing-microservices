name: Global CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  APP_ENV: ${{ vars.APP_ENV }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:

  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Required Variables
        run: |
          REQUIRED_VARS=(
            PROJECT_NAME
            APP_ENV
            AWS_REGION
            EKS_CLUSTER_NAME
          )

          for VAR in "${REQUIRED_VARS[@]}"
          do
            if [ -z "${!VAR}" ]; then
              echo "Missing variable: $VAR"
              exit 1
            fi
          done

      - name: Validate Required Secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          REQUIRED_SECRETS=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
          )

          for SECRET in "${REQUIRED_SECRETS[@]}"
          do
            if [ -z "${!SECRET}" ]; then
              echo "Missing secret: $SECRET"
              exit 1
            fi
          done

  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint mypy pytest pytest-cov pytest-asyncio httpx

      - name: Run Black
        run: black --check services scripts tests

      - name: Run Flake8
        run: flake8 services scripts tests

      - name: Run Pytest Unit Tests
        run: |
          for service in gateway auth converter notification; do
            echo "Testing $service..."
            pip install -r services/$service/requirements.txt
            threshold=30
            if [ "$service" = "auth" ]; then
              threshold=50
            elif [ "$service" = "notification" ]; then
              threshold=29
            fi
            (cd services/$service && APP_ENV=test PYTHONPATH=../../.:../.. pytest --cov=app --cov-report=term-missing --cov-fail-under=${threshold})
          done
          APP_ENV=test PYTHONPATH=. pytest tests/shared \
            --cov=shared/http \
            --cov=shared/middleware/metrics_guard.py \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Validate production config
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          APP_ENV=production \
          REDIS_HOST=redis \
          POSTGRES_SSL_MODE=require \
          bash scripts/validate-production-config.sh

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      E2E_TEST_EMAIL: ${{ vars.E2E_TEST_EMAIL }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Run integration and e2e tests
        run: bash scripts/run-integration-tests.sh

  yaml-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Validate YAML
        run: |
          yamllint -d relaxed .github infrastructure/kubernetes
          find infrastructure/helm -name 'values.yaml' -print0 | xargs -0 -r yamllint -d relaxed

  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose
        run: |
          mkdir -p .compose-secrets
          openssl genrsa -out .compose-secrets/jwt-private.pem 2048
          openssl rsa -in .compose-secrets/jwt-private.pem -pubout -out .compose-secrets/jwt-public.pem
          # 0644: compose bind-mounts these into non-root containers (UID mismatch
          # would make 0600 unreadable). The .compose-secrets dir guards host access.
          chmod 700 .compose-secrets
          chmod 644 .compose-secrets/jwt-private.pem .compose-secrets/jwt-public.pem
          cp .env.example .env.compose.runtime
          # The compose file now fails closed on missing credentials (no insecure
          # defaults). Supply throwaway values so this syntax/build validation can
          # run — these are NOT real secrets and never leave the CI runner.
          {
            echo "POSTGRES_PASSWORD=ci-dummy-postgres"
            echo "MONGO_PASSWORD=ci-dummy-mongo"
            echo "MONGO_URI=mongodb://ci:ci-dummy-mongo@mongodb:27017/video?authSource=admin"
            echo "REDIS_PASSWORD=ci-dummy-redis"
            echo "RABBITMQ_PASSWORD=ci-dummy-rabbit"
            echo "RABBITMQ_DEFAULT_PASS=ci-dummy-rabbit"
            echo "RABBITMQ_ERLANG_COOKIE=ci-dummy-cookie"
            echo "AWS_ACCESS_KEY_ID=ci-dummy-akid"
            echo "AWS_SECRET_ACCESS_KEY=ci-dummy-secret"
          } >> .env.compose.runtime
          export COMPOSE_ENV_FILE=.env.compose.runtime
          export COMPOSE_SECRETS_DIR=.compose-secrets
          docker compose --env-file .env.compose.runtime config

      - name: Build Docker Images
        run: |
          export COMPOSE_ENV_FILE=.env.compose.runtime
          export COMPOSE_SECRETS_DIR=.compose-secrets
          docker compose --env-file .env.compose.runtime build

  terraform-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.8.5

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  helm-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Helm Lint
        env:
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          STORAGE_CLASS: ${{ vars.STORAGE_CLASS }}
        run: |
          find infrastructure/helm -name Chart.yaml -exec dirname {} \; | while read chart
          do
            helm lint "$chart" \
              --set RABBITMQ_PASSWORD="${RABBITMQ_PASSWORD:-ci-lint-placeholder}" \
              --set RABBITMQ_USERNAME="${RABBITMQ_USERNAME:-ci-lint-placeholder}" \
              --set RABBITMQ_ERLANG_COOKIE="$(openssl rand -hex 16)" \
              --set persistence.size=1Gi \
              --set persistence.storageClass="${STORAGE_CLASS:-ebs-gp3}" \
              --set global.storage.className="${STORAGE_CLASS:-ebs-gp3}"
          done

  kubernetes-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Kubernetes Manifests
        run: |
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          errors = []
          for path in glob.glob("infrastructure/kubernetes/**/*.yaml", recursive=True):
              with open(path, encoding="utf-8") as handle:
                  try:
                      list(yaml.safe_load_all(handle))
                  except yaml.YAMLError as exc:
                      errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(glob.glob('infrastructure/kubernetes/**/*.yaml', recursive=True))} manifests")
          PY
