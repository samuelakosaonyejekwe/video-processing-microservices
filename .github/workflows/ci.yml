name: Global CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  APP_ENV: ${{ vars.APP_ENV }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:

  validate-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Required Variables
        run: |
          REQUIRED_VARS=(
            PROJECT_NAME
            APP_ENV
            AWS_REGION
            EKS_CLUSTER_NAME
          )

          for VAR in "${REQUIRED_VARS[@]}"
          do
            if [ -z "${!VAR}" ]; then
              echo "Missing variable: $VAR"
              exit 1
            fi
          done

      - name: Validate Required Secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          REQUIRED_SECRETS=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
          )

          for SECRET in "${REQUIRED_SECRETS[@]}"
          do
            if [ -z "${!SECRET}" ]; then
              echo "Missing secret: $SECRET"
              exit 1
            fi
          done

  python-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint mypy pytest pytest-cov

      - name: Run Black
        run: black --check services scripts

      - name: Run Flake8
        run: flake8 services scripts

      - name: Run Pytest Unit Tests
        run: |
          for service in gateway auth converter notification; do
            echo "Testing $service..."
            pip install -r services/$service/requirements.txt
            (cd services/$service && pytest)
          done

      - name: Run Integration Test Suite
        run: PYTHONPATH=. pytest tests

  yaml-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Validate YAML
        run: |
          yamllint -d relaxed .github infrastructure/kubernetes
          find infrastructure/helm -name 'values.yaml' -print0 | xargs -0 -r yamllint -d relaxed

  docker-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          mkdir -p .compose-secrets
          openssl genrsa -out .compose-secrets/jwt-private.pem 2048
          openssl rsa -in .compose-secrets/jwt-private.pem -pubout -out .compose-secrets/jwt-public.pem
          chmod 644 .compose-secrets/*.pem
          cp .env.example .env.compose.runtime
          export COMPOSE_ENV_FILE=.env.compose.runtime
          export COMPOSE_SECRETS_DIR=.compose-secrets
          docker compose --env-file .env.compose.runtime config

      - name: Build Docker Images
        run: |
          export COMPOSE_ENV_FILE=.env.compose.runtime
          export COMPOSE_SECRETS_DIR=.compose-secrets
          docker compose --env-file .env.compose.runtime build

  terraform-validation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  helm-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          find infrastructure/helm -name Chart.yaml -exec dirname {} \; | while read chart
          do
            helm lint "$chart" \
              --set RABBITMQ_PASSWORD=guest \
              --set RABBITMQ_USERNAME=guest \
              --set RABBITMQ_ERLANG_COOKIE=local-dev-cookie \
              --set persistence.size=1Gi \
              --set persistence.storageClass=gp2 \
              --set global.storage.className=gp2
          done

  kubernetes-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Kubernetes Manifests
        run: |
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          errors = []
          for path in glob.glob("infrastructure/kubernetes/**/*.yaml", recursive=True):
              with open(path, encoding="utf-8") as handle:
                  try:
                      list(yaml.safe_load_all(handle))
                  except yaml.YAMLError as exc:
                      errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(glob.glob('infrastructure/kubernetes/**/*.yaml', recursive=True))} manifests")
          PY
