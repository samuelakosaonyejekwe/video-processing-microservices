name: Database Validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  validate-database:

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - uses: actions/checkout@v4

      - name: Validate SQL
        run: |
          find databases/postgresql -name "*.sql"

      - name: Validate Mongo Scripts
        run: |
          find databases/mongodb -name "*.js"
