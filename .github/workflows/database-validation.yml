name: Database Validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  validate-database:

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install SQL Parser
        run: pip install sqlparse

      - name: Validate SQL
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "Parsing ${file}"
            if ! python3 - "${file}" <<'PY'
          import sys
          import sqlparse

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              raw = handle.read()

          statements = sqlparse.parse(raw)
          if not statements:
              print(f"{path}: no parseable SQL statements found")
              sys.exit(1)

          for statement in statements:
              # Strip comments and whitespace so a leading comment block does not
              # mask the real first keyword of the statement.
              stripped = sqlparse.format(
                  statement.value, strip_comments=True
              ).strip()
              if not stripped:
                  continue
              first = stripped.split(None, 1)[0].upper().rstrip(";")
              # Any DDL/DML/control keyword is acceptable; sqlparse is
              # non-validating, so we only fail on clearly garbled content that
              # does not start with an identifier-like token.
              if not first.isalpha():
                  print(f"{path}: unrecognized SQL near: {stripped[:80]}")
                  sys.exit(1)
          PY
            then
              status=1
            fi
          done < <(find databases/postgresql -name "*.sql" -print0)
          exit "${status}"

      - name: Validate Mongo Scripts
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "node not found on runner" >&2
            exit 1
          fi
          status=0
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            if ! node --check "${file}"; then
              status=1
            fi
          done < <(find databases/mongodb -name "*.js" -print0)
          exit "${status}"
