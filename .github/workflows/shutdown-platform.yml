name: Shutdown Platform (Low Cost Mode)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "soft = stop nodes + Jenkins only (~$116/month remaining). full = destroy EKS + Jenkins + NAT (~$10/month remaining, DB data lost)."
        required: true
        default: "soft"
        type: choice
        options:
          - soft
          - full
      confirm:
        description: "Full mode ONLY: type 'destroy' to confirm EKS/Jenkins/NAT teardown (DB data is backed up to S3 first, then PVCs are destroyed). Ignored for soft mode."
        required: false
        default: ""
        type: string
      skip_db_dump:
        description: "Full mode ONLY: skip the pre-teardown backups (STEP 0). Use ONLY when a fresh S3 backup already exists — e.g. re-running after a partial teardown where the node group is already gone and the DB pods can no longer start."
        required: false
        default: false
        type: boolean

jobs:
  shutdown:
    name: Shutdown (${{ github.event.inputs.mode }} mode)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Allow OIDC role assumption when vars.AWS_OIDC_ROLE_ARN is configured;
      # static keys remain the fallback when the var is unset.
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      EKS_NODE_GROUP_NAME: ${{ vars.EKS_NODE_GROUP_NAME }}
      EKS_INSTANCE_TYPE: ${{ vars.EKS_INSTANCE_TYPE }}
      EKS_DESIRED_SIZE: ${{ vars.EKS_DESIRED_SIZE }}
      EKS_MIN_SIZE: ${{ vars.EKS_MIN_SIZE }}
      EKS_MAX_SIZE: ${{ vars.EKS_MAX_SIZE }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      # Network inputs for STEP 4's `terraform destroy` (full mode). generate-
      # terraform-tfvars.sh emits these UNQUOTED with no safe default, so when
      # they are empty the tfvars become invalid HCL ("availability_zones =")
      # and vpc_cidr="" / empty lists also fail their length/cidr validations.
      # Mirror terraform-eks.yml so the destroy gets valid, matching values.
      VPC_CIDR: ${{ vars.VPC_CIDR }}
      AVAILABILITY_ZONES: ${{ vars.AVAILABILITY_ZONES }}
      PUBLIC_SUBNET_CIDRS: ${{ vars.PUBLIC_SUBNET_CIDRS }}
      PRIVATE_SUBNET_CIDRS: ${{ vars.PRIVATE_SUBNET_CIDRS }}
      # Full mode dumps the DBs here before destroy (start-platform restores from it).
      DATABASE_BACKUP_BUCKET: ${{ vars.DATABASE_BACKUP_BUCKET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Export Environment Aliases
        run: |
          chmod +x scripts/lib/env-aliases.sh scripts/export-github-env.sh
          source scripts/lib/env-aliases.sh
          bash scripts/export-github-env.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # Prefer OIDC role assumption when configured; fall back to static keys.
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install kubectl
        if: ${{ github.event.inputs.mode == 'full' }}
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0

      - name: Install Helm
        if: ${{ github.event.inputs.mode == 'full' }}
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Setup Terraform
        if: ${{ github.event.inputs.mode == 'full' }}
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.8.5

      - name: Run Shutdown
        env:
          SHUTDOWN_MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          # Honoured by shutdown-platform.sh to skip STEP 0 backups (full mode).
          SKIP_DB_DUMP: ${{ github.event.inputs.skip_db_dump }}
        run: |
          chmod +x scripts/shutdown-platform.sh scripts/lib/*.sh
          if [ "${SHUTDOWN_MODE}" = "full" ]; then
            # Full mode is destructive (PVCs are destroyed after the S3 backup).
            # Require an explicit typed confirmation so a stray dispatch can't
            # tear down production. --yes maps to CONFIRM_DESTROY=yes for the
            # non-interactive confirm guard.
            if [ "${CONFIRM}" != "destroy" ]; then
              echo "::error::Full shutdown requires the 'confirm' input to be set to 'destroy' (got '${CONFIRM}'). Re-run with confirm=destroy."
              exit 1
            fi
            bash scripts/shutdown-platform.sh --full --yes
          else
            bash scripts/shutdown-platform.sh
          fi
