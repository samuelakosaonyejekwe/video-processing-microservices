name: Terraform EKS Infrastructure

on:

  workflow_dispatch:
    inputs:
      force_unlock_lock_id:
        description: 'Optional stale Terraform state lock ID to force-unlock before plan'
        required: false
        type: string

  push:
    branches:
      - main

    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-eks.yml'

env:

  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  APP_ENV: ${{ vars.APP_ENV }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  EKS_NODE_GROUP_NAME: ${{ vars.EKS_NODE_GROUP_NAME }}
  EKS_INSTANCE_TYPE: ${{ vars.EKS_INSTANCE_TYPE }}
  EKS_DESIRED_SIZE: ${{ vars.EKS_DESIRED_SIZE }}
  EKS_MIN_SIZE: ${{ vars.EKS_MIN_SIZE }}
  EKS_MAX_SIZE: ${{ vars.EKS_MAX_SIZE }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  DOCKER_IMAGE_REGISTRY: ${{ vars.DOCKER_IMAGE_REGISTRY }}
  DOCKER_IMAGE_NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
  IMAGE_TAG: ${{ vars.IMAGE_TAG }}
  MESSAGING_NAMESPACE: ${{ vars.MESSAGING_NAMESPACE }}
  DATABASE_NAMESPACE: database

jobs:

  terraform:

    name: Terraform Infrastructure Provisioning

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Environment Aliases
        run: |
          chmod +x scripts/lib/env-aliases.sh scripts/export-github-env.sh
          source scripts/lib/env-aliases.sh
          bash scripts/export-github-env.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Make Scripts Executable
        run: chmod +x infrastructure/terraform/scripts/*.sh

      - name: Bootstrap Terraform Backend
        run: infrastructure/terraform/scripts/bootstrap-terraform-backend.sh

      - name: Generate terraform.tfvars
        run: infrastructure/terraform/scripts/generate-terraform-tfvars.sh

      - name: Terraform Init
        run: infrastructure/terraform/scripts/terraform-init.sh

      - name: Force Unlock Stale State Lock
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_unlock_lock_id != ''
        continue-on-error: true
        working-directory: infrastructure/terraform
        run: terraform force-unlock -force "${{ github.event.inputs.force_unlock_lock_id }}"

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        run: infrastructure/terraform/scripts/terraform-plan.sh

      - name: Run Service Unit Tests
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          pip install pytest
          for service in gateway auth converter notification; do
            pip install -r services/$service/requirements.txt
            (cd services/$service && pytest -q)
          done

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        run: infrastructure/terraform/scripts/terraform-apply.sh

      - name: Configure kubectl
        if: github.event_name == 'workflow_dispatch'
        run: infrastructure/terraform/scripts/configure-kubectl.sh

      - name: Verify EKS Cluster
        if: github.event_name == 'workflow_dispatch'
        run: infrastructure/terraform/scripts/verify-eks.sh

      - name: Output Infrastructure Information
        if: github.event_name == 'workflow_dispatch'
        working-directory: infrastructure/terraform
        run: terraform output

      - name: Setup Helm
        if: github.event_name == 'workflow_dispatch'
        uses: azure/setup-helm@v4

      - name: Deploy EKS Services
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_SESSION_SECRET: ${{ secrets.JWT_SESSION_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          chmod +x scripts/deploy-eks.sh scripts/deploy-services.sh scripts/create-docker-registry-secret.sh scripts/run-production-validation.sh scripts/discover-production-api-url.sh
          bash scripts/create-docker-registry-secret.sh
          bash scripts/deploy-eks.sh
          bash scripts/deploy-services.sh

      - name: Production Validation
        if: github.event_name == 'workflow_dispatch'
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_SESSION_SECRET: ${{ secrets.JWT_SESSION_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: bash scripts/run-production-validation.sh

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f infrastructure/terraform/terraform.tfvars
