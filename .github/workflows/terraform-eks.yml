name: Terraform EKS Infrastructure

on:

  workflow_dispatch:
    inputs:
      force_unlock_lock_id:
        description: 'Optional stale Terraform state lock ID to force-unlock before plan'
        required: false
        type: string
      image_tag:
        description: "ECR image tag to deploy on manual apply (defaults to commit SHA)"
        required: false
        default: ""

  push:
    branches:
      - main

    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-eks.yml'

env:

  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  APP_ENV: ${{ vars.APP_ENV }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  EKS_NODE_GROUP_NAME: ${{ vars.EKS_NODE_GROUP_NAME }}
  EKS_INSTANCE_TYPE: ${{ vars.EKS_INSTANCE_TYPE }}
  EKS_DESIRED_SIZE: ${{ vars.EKS_DESIRED_SIZE }}
  EKS_MIN_SIZE: ${{ vars.EKS_MIN_SIZE }}
  EKS_MAX_SIZE: ${{ vars.EKS_MAX_SIZE }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  DOCKER_IMAGE_REGISTRY: ${{ vars.DOCKER_IMAGE_REGISTRY }}
  DOCKER_IMAGE_NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.image_tag || github.sha) || github.sha }}
  MESSAGING_NAMESPACE: ${{ vars.MESSAGING_NAMESPACE }}
  DATABASE_NAMESPACE: ${{ vars.DATABASE_NAMESPACE }}
  APP_DOMAIN: ${{ vars.APP_DOMAIN }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL }}
  ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
  ALB_LISTEN_PORTS: ${{ vars.ALB_LISTEN_PORTS }}
  ALB_SSL_REDIRECT_PORT: ${{ vars.ALB_SSL_REDIRECT_PORT }}
  AWS_S3_VIDEO_BUCKET: ${{ vars.AWS_S3_VIDEO_BUCKET }}
  AWS_S3_AUDIO_BUCKET: ${{ vars.AWS_S3_AUDIO_BUCKET }}
  AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
  S3_UPLOAD_BUCKET: ${{ vars.S3_UPLOAD_BUCKET }}
  S3_AUDIO_BUCKET: ${{ vars.S3_AUDIO_BUCKET }}
  VPC_CIDR: ${{ vars.VPC_CIDR }}
  PUBLIC_SUBNET_CIDRS: ${{ vars.PUBLIC_SUBNET_CIDRS }}
  PRIVATE_SUBNET_CIDRS: ${{ vars.PRIVATE_SUBNET_CIDRS }}
  AVAILABILITY_ZONES: ${{ vars.AVAILABILITY_ZONES }}

jobs:

  terraform:

    name: Terraform Infrastructure Provisioning

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Export Environment Aliases
        run: |
          chmod +x scripts/lib/env-aliases.sh scripts/export-github-env.sh
          source scripts/lib/env-aliases.sh
          bash scripts/export-github-env.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # Prefer OIDC role assumption when configured (id-token: write is
          # already granted for this job); fall back to static keys otherwise.
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.8.5

      - name: Make Scripts Executable
        run: chmod +x infrastructure/terraform/scripts/*.sh

      - name: Bootstrap Terraform Backend
        run: infrastructure/terraform/scripts/bootstrap-terraform-backend.sh

      - name: Generate terraform.tfvars
        run: infrastructure/terraform/scripts/generate-terraform-tfvars.sh

      - name: Terraform Init
        run: infrastructure/terraform/scripts/terraform-init.sh

      - name: Force Unlock Stale State Lock
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_unlock_lock_id != ''
        continue-on-error: true
        working-directory: infrastructure/terraform
        env:
          LOCK_ID: ${{ github.event.inputs.force_unlock_lock_id }}
        run: |
          if ! [[ "${LOCK_ID}" =~ ^[a-f0-9\-]{36}$ ]]; then
            echo "ERROR: lock ID '${LOCK_ID}' is not a valid UUID. Aborting force-unlock."
            exit 1
          fi
          terraform force-unlock -force "${LOCK_ID}"

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        run: infrastructure/terraform/scripts/terraform-plan.sh

      - name: Run Service Unit Tests
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          APP_ENV: test
          REDIS_HOST: localhost
          RATE_LIMIT_FAIL_CLOSED: "false"
        run: |
          pip install pytest
          for service in gateway auth converter notification; do
            pip install -r services/$service/requirements.txt
            (cd services/$service && pytest -q)
          done

      - name: Validate Production Config
        if: github.event_name == 'workflow_dispatch'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          POSTGRES_SSL_MODE: require
        run: bash scripts/validate-production-config.sh

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        run: infrastructure/terraform/scripts/terraform-apply.sh

      - name: Configure kubectl
        if: github.event_name == 'workflow_dispatch'
        run: infrastructure/terraform/scripts/configure-kubectl.sh

      - name: Verify EKS Cluster
        if: github.event_name == 'workflow_dispatch'
        run: infrastructure/terraform/scripts/verify-eks.sh

      - name: Output Infrastructure Information
        if: github.event_name == 'workflow_dispatch'
        working-directory: infrastructure/terraform
        run: terraform output

      - name: Setup Helm
        if: github.event_name == 'workflow_dispatch'
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Deploy EKS Services
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_SESSION_SECRET: ${{ secrets.JWT_SESSION_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          chmod +x scripts/deploy-eks.sh scripts/deploy-services.sh scripts/create-docker-registry-secret.sh scripts/run-production-validation.sh scripts/discover-production-api-url.sh scripts/verify-ecr-images.sh scripts/lib/env-aliases.sh scripts/resolve-ecr-registry.sh
          source scripts/lib/env-aliases.sh
          source scripts/resolve-ecr-registry.sh
          bash scripts/verify-ecr-images.sh
          bash scripts/create-docker-registry-secret.sh
          bash scripts/deploy-eks.sh
          bash scripts/deploy-services.sh

      - name: Production Validation
        if: github.event_name == 'workflow_dispatch'
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_SESSION_SECRET: ${{ secrets.JWT_SESSION_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: bash scripts/run-production-validation.sh

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f infrastructure/terraform/terraform.tfvars
