name: Reusable Terraform Workflow

on:
  workflow_call:

    inputs:

      terraform_working_directory:
        required: false
        type: string
        default: infrastructure/terraform

      aws_region:
        required: true
        type: string

    secrets:

      AWS_ACCESS_KEY_ID:
        required: true

      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:

  reusable-terraform-validation:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Allow OIDC role assumption when vars.AWS_OIDC_ROLE_ARN is configured;
      # static keys remain the fallback when the var is unset.
      id-token: write

    defaults:
      run:
        working-directory: ${{ inputs.terraform_working_directory }}

    env:
      AWS_REGION: ${{ inputs.aws_region }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # Prefer OIDC role assumption when configured; fall back to static keys
          # passed in by the calling workflow.
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform plan -input=false
