name: Deploy EKS Services

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Microservices to EKS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      FRONTEND_DOMAIN_NAME: ${{ vars.FRONTEND_DOMAIN_NAME }}
      FRONTEND_ACM_CERTIFICATE_ARN: ${{ vars.FRONTEND_ACM_CERTIFICATE_ARN }}
      ALB_INGRESS_GROUP_NAME: ${{ vars.ALB_INGRESS_GROUP_NAME }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      ALB_LISTEN_PORTS: ${{ vars.ALB_LISTEN_PORTS }}
      ALB_SSL_REDIRECT_PORT: ${{ vars.ALB_SSL_REDIRECT_PORT }}
      S3_UPLOAD_BUCKET: ${{ vars.AWS_S3_VIDEO_BUCKET }}
      S3_AUDIO_BUCKET: ${{ vars.AWS_S3_AUDIO_BUCKET }}
      AWS_S3_VIDEO_BUCKET: ${{ vars.AWS_S3_VIDEO_BUCKET }}
      AWS_S3_AUDIO_BUCKET: ${{ vars.AWS_S3_AUDIO_BUCKET }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      APP_ENV: ${{ vars.APP_ENV }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      MESSAGING_NAMESPACE: ${{ vars.MESSAGING_NAMESPACE }}
      DATABASE_NAMESPACE: database
      DOCKER_IMAGE_REGISTRY: ${{ vars.DOCKER_IMAGE_REGISTRY }}
      DOCKER_IMAGE_NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
      IMAGE_TAG: ${{ vars.IMAGE_TAG }}
      DOCKER_USERNAME: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
      JWT_SESSION_SECRET: ${{ secrets.JWT_SESSION_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
      RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Environment Aliases
        run: |
          chmod +x scripts/lib/env-aliases.sh scripts/export-github-env.sh
          source scripts/lib/env-aliases.sh
          bash scripts/export-github-env.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"
          source scripts/lib/env-aliases.sh
          source scripts/resolve-ecr-registry.sh
          echo "DOCKER_IMAGE_REGISTRY=${DOCKER_IMAGE_REGISTRY}" >> "$GITHUB_ENV"
          echo "DOCKER_IMAGE_NAMESPACE=${DOCKER_IMAGE_NAMESPACE}" >> "$GITHUB_ENV"
          kubectl get nodes

      - name: Deploy Stack
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/create-docker-registry-secret.sh
          bash scripts/deploy-eks.sh
          bash scripts/deploy-services.sh
          bash scripts/verify-deployment.sh

      - name: Production Validation
        run: bash scripts/run-production-validation.sh
