name: Deploy EKS Services

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Terraform EKS Infrastructure"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy Microservices to EKS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      APP_ENV: ${{ vars.APP_ENV }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      GATEWAY_RELEASE_NAME: gateway
      DOCKER_USERNAME: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
      JWT_SESSION_SECRET: ${{ secrets.JWT_SESSION_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
      RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Environment Aliases
        run: |
          chmod +x scripts/lib/env-aliases.sh
          source scripts/lib/env-aliases.sh
          env | sort >> "$GITHUB_ENV"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"
          kubectl get nodes

      - name: Deploy Stack
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/create-docker-registry-secret.sh
          bash scripts/deploy-eks.sh
          bash scripts/deploy-services.sh

      - name: Production Validation
        run: bash scripts/run-production-validation.sh
