services:

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: ${GATEWAY_CONTAINER_NAME:-gateway}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      GATEWAY_SERVICE_PORT: "8080"
      JWT_ISSUER: ${JWT_ISSUER:-${JWT_TOKEN_ISSUER:-video-converter-platform}}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-${JWT_TOKEN_AUDIENCE:-video-converter-users}}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-${RABBITMQ_DEFAULT_USER:-guest}}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-${RABBITMQ_DEFAULT_PASS:-guest}}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-video-conversion-exchange}
      VIDEO_UPLOAD_QUEUE: ${VIDEO_UPLOAD_QUEUE:-${RABBITMQ_QUEUE:-video-upload-queue}}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification-queue}
      GATEWAY_EVENTS_QUEUE: ${GATEWAY_EVENTS_QUEUE:-gateway-events-queue}
      VIDEO_COMPLETED_QUEUE: ${VIDEO_COMPLETED_QUEUE:-video-completed-queue}
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: "8000"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_S3_VIDEO_BUCKET: ${AWS_S3_VIDEO_BUCKET:-${S3_UPLOAD_BUCKET:-video-uploads}}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-${S3_UPLOAD_BUCKET:-video-uploads}}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:-video-uploads}
      S3_AUDIO_BUCKET: ${S3_AUDIO_BUCKET:-audio-outputs}
      AWS_S3_AUDIO_BUCKET: ${AWS_S3_AUDIO_BUCKET:-${S3_AUDIO_BUCKET:-audio-outputs}}
      MAX_VIDEO_UPLOAD_SIZE_MB: ${MAX_VIDEO_UPLOAD_SIZE_MB:-500}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      MONGO_HOST: mongodb
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-video_converter}
      MONGO_USERNAME: ${MONGO_USERNAME:-mongo}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-mongo}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:mongo@mongodb:27017/video_converter?authSource=admin}
    ports:
      - "${GATEWAY_APP_PORT:-8080}:8080"
    volumes:
      - ${COMPOSE_SECRETS_DIR:-.}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      video-converter-network:
        aliases:
          - gateway-service

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: ${AUTH_CONTAINER_NAME:-auth}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8000"
      AUTH_SERVICE_PORT: "8000"
      POSTGRES_HOST: postgres
      POSTGRES_SSL_MODE: disable
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-default}
      JWT_ISSUER: ${JWT_ISSUER:-${JWT_TOKEN_ISSUER:-video-converter-platform}}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-${JWT_TOKEN_AUDIENCE:-video-converter-users}}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-${RABBITMQ_DEFAULT_USER:-guest}}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-${RABBITMQ_DEFAULT_PASS:-guest}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    ports:
      - "${AUTH_APP_PORT:-8000}:8000"
    volumes:
      - ${COMPOSE_SECRETS_DIR:-.}/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ${COMPOSE_SECRETS_DIR:-.}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - video-converter-network

  converter:
    build:
      context: .
      dockerfile: services/converter/Dockerfile
    container_name: ${CONVERTER_CONTAINER_NAME:-converter}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8002"
      CONVERTER_SERVICE_PORT: "8002"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-${RABBITMQ_DEFAULT_USER:-guest}}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-${RABBITMQ_DEFAULT_PASS:-guest}}
      VIDEO_UPLOAD_QUEUE: ${VIDEO_UPLOAD_QUEUE:-video-upload-queue}
      VIDEO_UPLOAD_RETRY_QUEUE: ${VIDEO_UPLOAD_RETRY_QUEUE:-video-upload-retry-queue}
      VIDEO_UPLOAD_DLQ: ${VIDEO_UPLOAD_DLQ:-video-upload-dlq}
      VIDEO_COMPLETED_QUEUE: ${VIDEO_COMPLETED_QUEUE:-video-completed-queue}
      VIDEO_FAILED_QUEUE: ${VIDEO_FAILED_QUEUE:-video-failed-queue}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification-queue}
      GATEWAY_EVENTS_QUEUE: ${GATEWAY_EVENTS_QUEUE:-gateway-events-queue}
      TEMP_STORAGE_PATH: ${TEMP_STORAGE_PATH:-/tmp}
      MONGO_HOST: mongodb
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-video_converter}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-${S3_UPLOAD_BUCKET:-video-uploads}}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:-video-uploads}
      S3_AUDIO_BUCKET: ${S3_AUDIO_BUCKET:-audio-outputs}
      AWS_S3_VIDEO_BUCKET: ${AWS_S3_VIDEO_BUCKET:-${S3_UPLOAD_BUCKET:-video-uploads}}
      AWS_S3_AUDIO_BUCKET: ${AWS_S3_AUDIO_BUCKET:-${S3_AUDIO_BUCKET:-audio-outputs}}
      MAX_VIDEO_UPLOAD_SIZE_MB: ${MAX_VIDEO_UPLOAD_SIZE_MB:-500}
      MAX_CONVERSION_TIMEOUT_SECONDS: ${MAX_CONVERSION_TIMEOUT_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER:-${JWT_TOKEN_ISSUER:-video-converter-platform}}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-${JWT_TOKEN_AUDIENCE:-video-converter-users}}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
    ports:
      - "${CONVERTER_APP_PORT:-8002}:8002"
    volumes:
      - ${COMPOSE_SECRETS_DIR:-.compose-secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - video-converter-network

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: ${NOTIFICATION_CONTAINER_NAME:-notification}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8003"
      NOTIFICATION_SERVICE_PORT: "8003"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-${RABBITMQ_DEFAULT_USER:-guest}}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-${RABBITMQ_DEFAULT_PASS:-guest}}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification-queue}
      NOTIFICATION_RETRY_QUEUE: ${NOTIFICATION_RETRY_QUEUE:-notification-retry-queue}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      WEBSOCKET_HOST: 0.0.0.0
      WEBSOCKET_PORT: ${WEBSOCKET_PORT:-8004}
    ports:
      - "${NOTIFICATION_APP_PORT:-8003}:8003"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - video-converter-network

  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_to_audio_converter}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/postgresql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - video-converter-network

  mongodb:
    image: mongo:7
    container_name: ${MONGO_CONTAINER_NAME:-mongodb}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-video_converter}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-converter-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-rabbitmq}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-${RABBITMQ_USERNAME:-guest}}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-${RABBITMQ_PASSWORD:-guest}}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-local-dev-cookie}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./messaging/rabbitmq/definitions.local.json:/etc/rabbitmq/definitions/definitions.json:ro
      - ./messaging/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-load-definitions.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - video-converter-network

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-redis}
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-converter-network

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ${MINIO_CONTAINER_NAME:-minio}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-converter-network

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-26Z
    container_name: ${MINIO_INIT_CONTAINER_NAME:-minio-init}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_UPLOAD_BUCKET:-video-uploads} &&
      mc mb --ignore-existing local/${S3_AUDIO_BUCKET:-audio-outputs}
      "
    networks:
      - video-converter-network

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-frontend}
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-gateway-service:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - video-converter-network

networks:
  video-converter-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:
  redis_data:
  minio_data:
