version: '3.9'

services:

  gateway-service:
    build:
      context: ./services/gateway
    ports:
      - "8000:8000"
    env_file:
      - ./services/gateway/.env
    depends_on:
      - auth-service
      - converter-service

  auth-service:
    build:
      context: ./services/auth
    ports:
      - "8001:8001"
    env_file:
      - ./services/auth/.env
    depends_on:
      - postgres

  converter-service:
    build:
      context: ./services/converter
    ports:
      - "8002:8002"
    env_file:
      - ./services/converter/.env
    depends_on:
      - rabbitmq
      - mongodb

  notification-service:
    build:
      context: ./services/notification
    ports:
      - "8003:8003"
    env_file:
      - ./services/notification/.env
    depends_on:
      - rabbitmq

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: video_converter_db
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"