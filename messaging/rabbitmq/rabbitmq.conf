# LOCAL docker-compose stack ONLY (mounted by docker-compose.yml). The compose
# broker is bound to 127.0.0.1 (not externally reachable) and uses the built-in
# guest user for a frictionless dev/integration experience. Do NOT "harden" this
# by setting loopback_users.guest = true — that breaks container-to-container
# auth on the compose network and the integration tests.
# PRODUCTION RabbitMQ runs on Kubernetes via the Helm chart and the separate
# messaging/rabbitmq/definitions.json (which defines NO users — credentials come
# from Secrets) and is locked down by NetworkPolicy. This file does not affect it.
management.load_definitions = /etc/rabbitmq/definitions/definitions.json
loopback_users.guest = false
