# ==========================================================
# RABBITMQ PRODUCTION CONFIGURATION
# ==========================================================

# ----------------------------------------------------------
# AUTHENTICATION
# ----------------------------------------------------------

default_user = ${RABBITMQ_USERNAME}

default_pass = ${RABBITMQ_PASSWORD}

default_vhost = ${RABBITMQ_VHOST}

loopback_users = none

# ----------------------------------------------------------
# DEFINITIONS
# ----------------------------------------------------------

management.load_definitions = /etc/rabbitmq/definitions.json

# ----------------------------------------------------------
# NETWORKING
# ----------------------------------------------------------

listeners.tcp.default = ${RABBITMQ_PORT}

management.tcp.port = ${RABBITMQ_MANAGEMENT_PORT}

# Optional TLS listener
# listeners.ssl.default = ${RABBITMQ_SSL_PORT}

# ----------------------------------------------------------
# ERLANG / CLUSTERING
# ----------------------------------------------------------

erlang.cookie = ${RABBITMQ_ERLANG_COOKIE}

cluster_formation.peer_discovery_backend = classic_config

cluster_partition_handling = autoheal

queue_master_locator = min-masters

# ----------------------------------------------------------
# PERFORMANCE
# ----------------------------------------------------------

vm_memory_high_watermark.relative = ${RABBITMQ_MEMORY_HIGH_WATERMARK}

disk_free_limit.relative = ${RABBITMQ_DISK_FREE_LIMIT}

channel_max = ${RABBITMQ_CHANNEL_MAX}

heartbeat = ${RABBITMQ_HEARTBEAT}

consumer_timeout = ${RABBITMQ_CONSUMER_TIMEOUT}

collect_statistics_interval = ${RABBITMQ_STATISTICS_INTERVAL}

# ----------------------------------------------------------
# TCP SETTINGS
# ----------------------------------------------------------

tcp_listen_options.backlog = ${RABBITMQ_TCP_BACKLOG}

tcp_listen_options.nodelay = true

tcp_listen_options.keepalive = true

tcp_listen_options.exit_on_close = false

# ----------------------------------------------------------
# LOGGING
# ----------------------------------------------------------

log.console = true

log.console.level = ${RABBITMQ_LOG_LEVEL}

log.console.formatter = json

# ----------------------------------------------------------
# MANAGEMENT
# ----------------------------------------------------------

management.disable_stats = false

management.rates_mode = basic

management.sample_retention_policies.global.minute = 5

management.sample_retention_policies.global.hour = 60

management.sample_retention_policies.global.day = 1200

# ----------------------------------------------------------
# SECURITY HARDENING
# ----------------------------------------------------------

auth_mechanisms.1 = PLAIN

auth_mechanisms.2 = AMQPLAIN

reverse_dns_lookups = false

disk_monitor_failure_retries = 10

credit_flow_default_credit = {400, 200}

background_gc_enabled = true

delegate_count = ${RABBITMQ_DELEGATE_COUNT}

# ----------------------------------------------------------
# CONNECTION LIMITS
# ----------------------------------------------------------

connection_max = ${RABBITMQ_CONNECTION_MAX}

handshake_timeout = ${RABBITMQ_HANDSHAKE_TIMEOUT}

ssl_handshake_timeout = ${RABBITMQ_SSL_HANDSHAKE_TIMEOUT}

# ----------------------------------------------------------
# QUEUE SETTINGS
# ----------------------------------------------------------

default_consumer_prefetch = {false, ${RABBITMQ_PREFETCH_COUNT}}

queue_index_embed_msgs_below = ${RABBITMQ_QUEUE_EMBED_MSG_SIZE}

lazy_queue_explicit_gc_run_operation_threshold = ${RABBITMQ_LAZY_QUEUE_GC_THRESHOLD}

# ----------------------------------------------------------
# STREAM / MESSAGE SETTINGS
# ----------------------------------------------------------

msg_store_credit_disc_bound = ${RABBITMQ_MSG_STORE_CREDIT_DISC_BOUND}

msg_store_io_batch_size = ${RABBITMQ_MSG_STORE_IO_BATCH_SIZE}

# ----------------------------------------------------------
# NOTES
# ----------------------------------------------------------

# NEVER hardcode:
#
# - usernames
# - passwords
# - Erlang cookies
# - JWT secrets
# - SMTP credentials
# - RabbitMQ URLs
# - AMQP URLs
# - Docker credentials
#
# ALL secrets must come ONLY from:
#
# - Kubernetes Secrets
# - Docker Secrets
# - GitHub Secrets
# - AWS Secrets Manager
#
# This configuration is production-grade
# and contains NO hardcoded secrets.