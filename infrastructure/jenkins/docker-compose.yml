version: "3.9"

services:

  jenkins:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${JENKINS_CONTAINER_NAME:-jenkins}

    restart: always

    user: jenkins
    group_add:
      - docker

    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"

    environment:

      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs

      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_USERNAME}

      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}

      JENKINS_URL: ${JENKINS_URL}

      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}

      GITHUB_BRANCH: ${GITHUB_BRANCH}

      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Djava.awt.headless=true

    env_file:
      - .env

    volumes:

      - jenkins_home:/var/jenkins_home

      - ./casc:/var/jenkins_home/casc_configs

      - ./init.groovy.d:/var/jenkins_home/init.groovy.d

      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - jenkins-network

    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/login"
        ]

      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 120s

volumes:

  jenkins_home:

    driver: local

networks:

  jenkins-network:

    driver: bridge