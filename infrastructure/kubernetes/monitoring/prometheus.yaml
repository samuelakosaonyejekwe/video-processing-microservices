apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: ${MONITORING_NAMESPACE}

  labels:
    app: prometheus
    monitoring: prometheus
    environment: ${APP_ENV}

spec:
  replicas: ${PROMETHEUS_REPLICAS}

  # The TSDB lives on a ReadWriteOnce EBS PVC, so the old pod must be torn down
  # before the new one mounts the volume (no rolling overlap).
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: prometheus

  template:

    metadata:
      labels:
        app: prometheus
        monitoring: prometheus
        environment: ${APP_ENV}

    spec:

      # Used by the kubernetes_sd_configs scrape jobs (kubelet, cAdvisor, API
      # server) — see prometheus-rbac.yaml for the bound ClusterRole.
      serviceAccountName: prometheus

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534

        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:

        - maxSkew: 1

          topologyKey: kubernetes.io/hostname

          whenUnsatisfiable: ScheduleAnyway

          labelSelector:
            matchLabels:
              app: prometheus

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:

                  matchExpressions:

                    - key: app
                      operator: In
                      values:
                        - prometheus

      containers:

        - name: prometheus

          image: ${PROMETHEUS_IMAGE}

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 9090
              protocol: TCP

          args:

            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"

          resources:

            requests:
              cpu: ${PROMETHEUS_CPU_REQUEST}
              memory: ${PROMETHEUS_MEMORY_REQUEST}

            limits:
              cpu: ${PROMETHEUS_CPU_LIMIT}
              memory: ${PROMETHEUS_MEMORY_LIMIT}

          volumeMounts:

            - name: prometheus-config
              mountPath: /etc/prometheus

            - name: prometheus-storage
              mountPath: /prometheus

          startupProbe:

            httpGet:
              path: /-/healthy
              port: 9090

            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /-/healthy
              port: 9090

            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:

            httpGet:
              path: /-/ready
              port: 9090

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: true

            capabilities:

              drop:
                - ALL

      volumes:

        - name: prometheus-config

          configMap:
            name: prometheus-config

        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: ${PROMETHEUS_PVC_NAME}

---
apiVersion: v1
kind: Service

metadata:
  name: prometheus-service
  namespace: ${MONITORING_NAMESPACE}

  labels:
    app: prometheus
    monitoring: prometheus
    environment: ${APP_ENV}

spec:

  selector:
    app: prometheus

  ports:

    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090

  type: ClusterIP
