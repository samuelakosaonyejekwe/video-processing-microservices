apiVersion: apps/v1

kind: Deployment

metadata:
  name: prometheus
  namespace: video-converter

spec:

  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:

    metadata:
      labels:
        app: prometheus

    spec:

      containers:

        - name: prometheus

          image: prom/prometheus:latest

          ports:
            - containerPort: 9090

          resources:

            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1

kind: Service

metadata:
  name: prometheus-service
  namespace: video-converter

spec:

  selector:
    app: prometheus

  ports:

    - protocol: TCP
      port: 9090
      targetPort: 9090

  type: ClusterIP