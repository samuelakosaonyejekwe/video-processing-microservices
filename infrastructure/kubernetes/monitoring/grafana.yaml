apiVersion: apps/v1

kind: Deployment

metadata:
  name: grafana
  namespace: video-converter

spec:

  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:

    metadata:
      labels:
        app: grafana

    spec:

      containers:

        - name: grafana

          image: grafana/grafana:latest

          ports:
            - containerPort: 3000

          env:

            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123

          resources:

            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1

kind: Service

metadata:
  name: grafana-service
  namespace: video-converter

spec:

  selector:
    app: grafana

  ports:

    - protocol: TCP
      port: 3000
      targetPort: 3000

  type: LoadBalancer