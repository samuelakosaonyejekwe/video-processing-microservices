apiVersion: v1

kind: ConfigMap

metadata:

  name: ${GRAFANA_DASHBOARD_CONFIGMAP_NAME}

  namespace: ${MONITORING_NAMESPACE}

  labels:

    grafana_dashboard: "1"

data:

  platform-overview-dashboard.json: |

    ${PLATFORM_OVERVIEW_DASHBOARD_JSON}

  rabbitmq-dashboard.json: |

    ${RABBITMQ_DASHBOARD_JSON}

  keda-dashboard.json: |

    ${KEDA_DASHBOARD_JSON}

  kubernetes-dashboard.json: |

    ${KUBERNETES_DASHBOARD_JSON}

  eks-dashboard.json: |

    ${EKS_DASHBOARD_JSON}

  node-dashboard.json: |

    ${NODE_DASHBOARD_JSON}

  pod-dashboard.json: |

    ${POD_DASHBOARD_JSON}
