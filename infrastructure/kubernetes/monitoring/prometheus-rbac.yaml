# RBAC for Prometheus' Kubernetes service discovery. Lets the Prometheus pod
# (running in the application namespace) authenticate to the EKS API server and
# scrape the kubelet, cAdvisor and API-server metrics via the API-server proxy —
# the data behind the Kubernetes / EKS / Pod dashboards. Read-only; the bearer
# token is the pod's auto-mounted ServiceAccount token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ${K8S_NAMESPACE}
  labels:
    app: prometheus
    environment: ${APP_ENV}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ${K8S_NAMESPACE}
