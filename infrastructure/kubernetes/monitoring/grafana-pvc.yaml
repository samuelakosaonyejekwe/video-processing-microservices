apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${GRAFANA_PVC_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: grafana
    service: grafana-service
    environment: ${APP_ENV}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${GRAFANA_STORAGE_CLASS}
  resources:
    requests:
      storage: ${GRAFANA_STORAGE_SIZE}
