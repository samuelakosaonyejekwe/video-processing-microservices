apiVersion: apps/v1

kind: Deployment

metadata:

  name: ingress-nginx-controller

  namespace: ${INGRESS_NGINX_NAMESPACE}

  labels:

    app: ingress-nginx

    component: ingress-controller

    environment: ${APP_ENV}

spec:

  replicas: ${INGRESS_NGINX_REPLICA_COUNT}

  revisionHistoryLimit: 5

  selector:

    matchLabels:

      app: ingress-nginx

  template:

    metadata:

      labels:

        app: ingress-nginx

        component: ingress-controller

        environment: ${APP_ENV}

    spec:

      serviceAccountName: ingress-nginx

      securityContext:

        runAsNonRoot: true

        seccompProfile:

          type: RuntimeDefault

      containers:

        - name: ingress-nginx-controller

          image: ${INGRESS_NGINX_IMAGE}

          imagePullPolicy: Always

          securityContext:

            runAsNonRoot: true

            runAsUser: 101

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: false

            capabilities:

              drop:

                - ALL

          args:

            - /nginx-ingress-controller

            - --ingress-class=${INGRESS_CLASS_NAME}

          ports:

            - name: http

              containerPort: 80

              protocol: TCP

            - name: https

              containerPort: 443

              protocol: TCP

          resources:

            requests:

              cpu: "200m"

              memory: "256Mi"

            limits:

              cpu: "500m"

              memory: "512Mi"

          readinessProbe:

            httpGet:

              path: /healthz

              port: 10254

            initialDelaySeconds: 10

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 3

          livenessProbe:

            httpGet:

              path: /healthz

              port: 10254

            initialDelaySeconds: 30

            periodSeconds: 20

            timeoutSeconds: 5

            failureThreshold: 5

          volumeMounts:

            - name: nginx-tmp

              mountPath: /tmp

            - name: nginx-cache

              mountPath: /var/cache/nginx

      volumes:

        - name: nginx-tmp

          emptyDir: {}

        - name: nginx-cache

          emptyDir: {}

      restartPolicy: Always

      terminationGracePeriodSeconds: 30
