apiVersion: apps/v1

kind: Deployment

metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx

spec:

  replicas: 2

  selector:
    matchLabels:
      app: ingress-nginx

  template:

    metadata:
      labels:
        app: ingress-nginx

    spec:

      serviceAccountName: ingress-nginx

      containers:

        - name: ingress-nginx-controller

          image: registry.k8s.io/ingress-nginx/controller:v1.11.3

          args:
            - /nginx-ingress-controller
            - --ingress-class=nginx

          ports:
            - containerPort: 80
            - containerPort: 443

          resources:

            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"