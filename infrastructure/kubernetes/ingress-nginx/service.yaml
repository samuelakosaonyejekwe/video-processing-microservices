apiVersion: v1

kind: Service

metadata:
  name: ingress-nginx-service
  namespace: ingress-nginx

spec:

  selector:
    app: ingress-nginx

  ports:

    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

    - name: https
      protocol: TCP
      port: 443
      targetPort: 443

  type: LoadBalancer