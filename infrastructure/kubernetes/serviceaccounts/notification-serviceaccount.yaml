apiVersion: v1
kind: ServiceAccount

metadata:
  name: notification-service-account
  namespace: ${K8S_NAMESPACE}
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/${PROJECT_NAME}-${APP_ENV}-notification-irsa-role

# IRSA projects its own token; the default API token mount is not needed.
automountServiceAccountToken: false
