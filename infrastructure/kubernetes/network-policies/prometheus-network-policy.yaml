apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-network-policy
  namespace: ${K8S_NAMESPACE}
  labels:
    app: prometheus
    policy: prometheus-access
    environment: ${APP_ENV}
spec:
  podSelector:
    matchLabels:
      ${PROMETHEUS_LABEL_KEY}: ${PROMETHEUS_LABEL_VALUE}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    #
    # GRAFANA QUERIES
    #
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
    #
    # UI ACCESS (kubectl port-forward via node, or in-VPC sources).
    #
    - from:
        - ipBlock:
            cidr: ${VPC_CIDR}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    #
    # DNS (target/service-name resolution)
    #
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${KUBE_SYSTEM_NAMESPACE}
      ports:
        - protocol: UDP
          port: ${DNS_PORT}
        - protocol: TCP
          port: ${DNS_PORT}
    #
    # SCRAPE: application services (/metrics) in the app namespace
    #
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${K8S_NAMESPACE}
      ports:
        - protocol: TCP
          port: ${GATEWAY_PORT}
        - protocol: TCP
          port: ${AUTH_APP_PORT}
        - protocol: TCP
          port: ${CONVERTER_SERVICE_PORT}
        - protocol: TCP
          port: ${NOTIFICATION_APP_PORT}
    #
    # SCRAPE: RabbitMQ prometheus plugin (messaging namespace)
    #
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${MESSAGING_NAMESPACE}
      ports:
        - protocol: TCP
          port: 15692
    #
    # SCRAPE: KEDA operator prometheus metrics (keda namespace, port 8080)
    #
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${KEDA_NAMESPACE}
      ports:
        - protocol: TCP
          port: 8080
    #
    # SCRAPE: kube-state-metrics (8080) and node-exporter (9100) in the
    # monitoring namespace — feeds the Kubernetes / EKS / Node / Pod dashboards.
    #
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${MONITORING_NAMESPACE}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9100
    #
    # KUBERNETES SERVICE DISCOVERY + API server scrape (kubernetes-apiservers).
    # Both reach the API server on 443; the AWS VPC CNI agent evaluates ClusterIP
    # egress against the post-DNAT endpoint IPs, which fall inside the VPC CIDR.
    # NOTE: do NOT add the EKS service CIDR (172.20.0.0/16) as an ipBlock here —
    # doing so flips ClusterIP matching to pre-DNAT for that whole range and
    # breaks the app-service scrape jobs (which target their ClusterIPs on :80).
    #
    - to:
        - ipBlock:
            cidr: ${VPC_CIDR}
      ports:
        - protocol: TCP
          port: 443
    #
    # SCRAPE: kubelet + cAdvisor directly on each node's kubelet (InternalIP:10250
    # within the VPC CIDR) — feeds the Node / Pod / Kubernetes dashboards.
    #
    - to:
        - ipBlock:
            cidr: ${VPC_CIDR}
      ports:
        - protocol: TCP
          port: 10250
