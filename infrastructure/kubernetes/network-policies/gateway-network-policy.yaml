apiVersion: networking.k8s.io/v1

kind: NetworkPolicy

metadata:
  name: ${GATEWAY_NETWORK_POLICY_NAME}
  namespace: ${K8S_NAMESPACE}

  labels:
    app: ${GATEWAY_POD_LABEL}
    component: gateway
    policy: ${GATEWAY_NETWORK_POLICY_LABEL}
    environment: ${APP_ENV}

spec:

  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - ${GATEWAY_POD_LABEL}
          - ${GATEWAY_WORKER_POD_LABEL}

  policyTypes:
    - Ingress
    - Egress

  ingress:

    #
    # ALLOW TRAFFIC FROM AWS ALB (target-type ip) WITHIN VPC
    #
    - from:
        - ipBlock:
            cidr: ${VPC_CIDR}
      ports:
        - protocol: TCP
          port: ${GATEWAY_PORT}

    #
    # ALLOW TRAFFIC FROM FRONTEND NGINX PROXY
    #
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: ${GATEWAY_PORT}

  egress:

    #
    # AUTH SERVICE
    #
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${K8S_NAMESPACE}

          podSelector:
            matchLabels:
              app: ${AUTH_APP_NAME}

      ports:

        - protocol: TCP
          port: ${AUTH_SERVICE_PORT}

    #
    # CONVERTER SERVICE
    #
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${K8S_NAMESPACE}

          podSelector:
            matchLabels:
              app: ${CONVERTER_APP_NAME}

      ports:

        - protocol: TCP
          port: ${CONVERTER_SERVICE_PORT}

    #
    # NOTIFICATION SERVICE
    #
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${K8S_NAMESPACE}

          podSelector:
            matchLabels:
              app: ${NOTIFICATION_POD_LABEL}

      ports:

        - protocol: TCP
          port: ${NOTIFICATION_SERVICE_PORT}

    #
    # MONGODB
    #
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${DATABASE_NAMESPACE}

          podSelector:
            matchLabels:
              app: ${MONGODB_APP_NAME}

      ports:

        - protocol: TCP
          port: ${MONGODB_PORT}

    #
    # RABBITMQ
    #
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${MESSAGING_NAMESPACE}

          podSelector:
            matchLabels:
              app: ${RABBITMQ_APP_NAME}

      ports:

        - protocol: TCP
          port: ${RABBITMQ_AMQP_PORT}

    #
    # DNS
    #
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${KUBE_SYSTEM_NAMESPACE}

      ports:

        - protocol: UDP
          port: ${DNS_PORT}

        - protocol: TCP
          port: ${DNS_PORT}

    #
    # ALLOW HTTPS TO AWS S3 AND EXTERNAL APIS
    #
    - ports:
        - protocol: TCP
          port: ${HTTPS_PORT}

    #
    # REDIS
    #
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: ${REDIS_PORT}
