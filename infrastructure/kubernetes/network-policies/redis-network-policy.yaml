apiVersion: networking.k8s.io/v1

kind: NetworkPolicy

metadata:
  name: ${REDIS_NETWORK_POLICY_NAME}
  namespace: ${K8S_NAMESPACE}

  labels:
    app: redis
    policy: redis-access
    environment: ${APP_ENV}

spec:

  podSelector:
    matchLabels:
      app: redis

  policyTypes:
    - Ingress

  ingress:

    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - ${NOTIFICATION_POD_LABEL}
                  - ${NOTIFICATION_WORKER_POD_LABEL}
                  - ${GATEWAY_POD_LABEL}
                  - ${GATEWAY_WORKER_POD_LABEL}
                  - ${AUTH_APP_NAME}
      ports:
        - protocol: TCP
          port: ${REDIS_PORT}
