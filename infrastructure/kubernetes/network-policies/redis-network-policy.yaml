apiVersion: networking.k8s.io/v1

kind: NetworkPolicy

metadata:
  name: ${REDIS_NETWORK_POLICY_NAME}
  namespace: ${K8S_NAMESPACE}

  labels:
    app: redis
    policy: redis-access
    environment: ${APP_ENV}

spec:

  podSelector:
    matchLabels:
      app: redis

  policyTypes:
    - Ingress

  ingress:

    #
    # ALLOW TRAFFIC FROM NOTIFICATION SERVICE
    #
    - from:
        - podSelector:
            matchLabels:
              app: ${NOTIFICATION_POD_LABEL}
      ports:
        - protocol: TCP
          port: ${REDIS_PORT}
