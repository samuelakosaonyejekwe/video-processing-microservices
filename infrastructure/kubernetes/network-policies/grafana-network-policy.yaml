apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: ${K8S_NAMESPACE}
  labels:
    app: grafana
    policy: grafana-access
    environment: ${APP_ENV}
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    #
    # ALLOW UI ACCESS (kubectl port-forward via node, or in-VPC / ALB sources).
    # Pod and node IPs are within the VPC CIDR.
    #
    - from:
        - ipBlock:
            cidr: ${VPC_CIDR}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    #
    # PROMETHEUS DATASOURCE
    #
    - to:
        - podSelector:
            matchLabels:
              ${PROMETHEUS_LABEL_KEY}: ${PROMETHEUS_LABEL_VALUE}
      ports:
        - protocol: TCP
          port: 9090
    #
    # DNS
    #
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${KUBE_SYSTEM_NAMESPACE}
      ports:
        - protocol: UDP
          port: ${DNS_PORT}
        - protocol: TCP
          port: ${DNS_PORT}
