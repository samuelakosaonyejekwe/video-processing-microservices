apiVersion: networking.k8s.io/v1

kind: NetworkPolicy

metadata:
  name: default-deny-all
  namespace: ${K8S_NAMESPACE}

  labels:
    app: network-security
    policy: default-deny
    environment: ${APP_ENV}

spec:

  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

  ingress: []

  egress: []

---
#
# DATABASE NAMESPACE: default-deny-all backstop.
# Per-pod allows (mongodb/postgres ingress + DNS egress) live in their own
# policies and are additive to this deny-all baseline.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ${DATABASE_NAMESPACE}
  labels:
    app: network-security
    policy: default-deny
    environment: ${APP_ENV}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

---
#
# DATABASE NAMESPACE: allow DNS egress for every pod so the deny-all above does
# not break cluster service resolution.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ${DATABASE_NAMESPACE}
  labels:
    app: network-security
    policy: allow-dns
    environment: ${APP_ENV}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${KUBE_SYSTEM_NAMESPACE}
      ports:
        - protocol: UDP
          port: ${DNS_PORT}
        - protocol: TCP
          port: ${DNS_PORT}

---
#
# MESSAGING NAMESPACE: default-deny-all backstop.
# RabbitMQ-specific ingress/egress allows live in rabbitmq-network-policy.yaml.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ${MESSAGING_NAMESPACE}
  labels:
    app: network-security
    policy: default-deny
    environment: ${APP_ENV}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

---
#
# MESSAGING NAMESPACE: allow DNS egress for every pod.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ${MESSAGING_NAMESPACE}
  labels:
    app: network-security
    policy: allow-dns
    environment: ${APP_ENV}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${KUBE_SYSTEM_NAMESPACE}
      ports:
        - protocol: UDP
          port: ${DNS_PORT}
        - protocol: TCP
          port: ${DNS_PORT}

---
#
# MONITORING NAMESPACE: default-deny-all backstop.
# This namespace currently hosts only ServiceMonitor CRs (no pods); the deny-all
# plus DNS allow is a safe baseline if pods are added later.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ${MONITORING_NAMESPACE}
  labels:
    app: network-security
    policy: default-deny
    environment: ${APP_ENV}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

---
#
# MONITORING NAMESPACE: allow DNS egress for every pod.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ${MONITORING_NAMESPACE}
  labels:
    app: network-security
    policy: allow-dns
    environment: ${APP_ENV}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${KUBE_SYSTEM_NAMESPACE}
      ports:
        - protocol: UDP
          port: ${DNS_PORT}
        - protocol: TCP
          port: ${DNS_PORT}
