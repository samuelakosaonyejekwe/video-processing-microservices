apiVersion: networking.k8s.io/v1

kind: NetworkPolicy

metadata:
  name: rabbitmq-network-policy
  namespace: ${MESSAGING_NAMESPACE}

  labels:
    app: ${RABBITMQ_APP_NAME}
    component: messaging
    environment: ${APP_ENV}

spec:

  podSelector:
    matchLabels:
      app: ${RABBITMQ_APP_NAME}

  policyTypes:
    - Ingress
    - Egress

  ingress:

    # AMQP from the specific producer/consumer pods in the app namespace.
    # The management API port is intentionally NOT exposed to this broad set.
    - from:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${K8S_NAMESPACE}
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - ${GATEWAY_POD_LABEL}
                  - ${GATEWAY_WORKER_POD_LABEL}
                  - ${CONVERTER_APP_NAME}
                  - ${CONVERTER_WORKER_POD_LABEL}
                  - ${NOTIFICATION_POD_LABEL}
                  - ${NOTIFICATION_WORKER_POD_LABEL}
                  - ${AUTH_APP_NAME}

      ports:

        - protocol: TCP
          port: ${RABBITMQ_AMQP_PORT}

    # KEDA polls queue depth over AMQP (RABBITMQ_PROTOCOL=amqp); AMQP only.
    - from:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${KEDA_NAMESPACE}

      ports:

        - protocol: TCP
          port: ${RABBITMQ_AMQP_PORT}

    # RabbitMQ management API (15672) exposed only to an explicit admin/monitoring
    # selector so it is not reachable by every workload in the app namespace.
    - from:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${K8S_NAMESPACE}
          podSelector:
            matchLabels:
              rabbitmq-management-access: "true"

      ports:

        - protocol: TCP
          port: ${RABBITMQ_MANAGEMENT_PORT}

  egress:

    # DNS access
    - to:

        - namespaceSelector: {}

      ports:

        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

    # RabbitMQ intra-cluster communication
    - to:

        - podSelector:
            matchLabels:
              app: ${RABBITMQ_APP_NAME}

      ports:

        - protocol: TCP
          port: ${RABBITMQ_ERLANG_PORT}

        - protocol: TCP
          port: ${RABBITMQ_CLUSTERING_PORT}

        - protocol: TCP
          port: ${RABBITMQ_AMQP_PORT}

        - protocol: TCP
          port: ${RABBITMQ_MANAGEMENT_PORT}
