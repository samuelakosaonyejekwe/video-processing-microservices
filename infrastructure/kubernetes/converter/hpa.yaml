apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: converter-hpa
  namespace: ${K8S_NAMESPACE}

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: converter-service

  minReplicas: ${CONVERTER_HPA_MIN_REPLICAS}

  maxReplicas: 10

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70
