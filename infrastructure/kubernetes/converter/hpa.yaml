apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: converter-hpa
  namespace: ${K8S_NAMESPACE}

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: converter-service

  minReplicas: ${CONVERTER_HPA_MIN_REPLICAS}

  maxReplicas: 10

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
