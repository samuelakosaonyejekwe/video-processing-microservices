apiVersion: apps/v1
kind: Deployment

metadata:
  name: converter-worker
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ${CONVERTER_WORKER_POD_LABEL}
    service: converter-service
    component: queue-worker
    environment: ${APP_ENV}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ${CONVERTER_WORKER_POD_LABEL}

  template:
    metadata:
      labels:
        app: ${CONVERTER_WORKER_POD_LABEL}
        service: converter-service
        component: queue-worker
        environment: ${APP_ENV}

    spec:
      enableServiceLinks: false
      serviceAccountName: converter-service-account
      imagePullSecrets:
        - name: ${DOCKER_REGISTRY_SECRET_NAME}

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 120

      containers:
        - name: converter-worker
          image: ${DOCKER_IMAGE_REGISTRY}/${DOCKER_IMAGE_NAMESPACE}/converter-service:${IMAGE_TAG}
          imagePullPolicy: Always
          command: ["python", "-m", "app.run_worker"]

          envFrom:
            - configMapRef:
                name: converter-config
            - secretRef:
                name: mongodb-secret
            - secretRef:
                name: rabbitmq-secret
            - secretRef:
                name: jwt-secret

          env:
            - name: ENABLE_QUEUE_CONSUMER
              value: "true"
            - name: APP_PORT
              value: "${CONVERTER_APP_PORT}"
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_PUBLIC_KEY
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_URI
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URI

          resources:
            requests:
              memory: "${CONVERTER_MEMORY_REQUEST}"
              cpu: "${CONVERTER_CPU_REQUEST}"
            limits:
              memory: "${CONVERTER_MEMORY_LIMIT}"
              cpu: "${CONVERTER_CPU_LIMIT}"

          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/worker-ready"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/worker-ready"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: converter-tmp
              mountPath: /tmp/converter
            - name: worker-tmp
              mountPath: /tmp

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

      volumes:
        - name: converter-tmp
          emptyDir:
            sizeLimit: 5Gi
        - name: worker-tmp
          emptyDir:
            sizeLimit: 2Gi

      restartPolicy: Always
