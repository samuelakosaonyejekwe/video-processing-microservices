apiVersion: apps/v1
kind: Deployment

metadata:
  name: converter-service
  namespace: ${K8S_NAMESPACE}

spec:
  replicas: ${CONVERTER_API_REPLICA_COUNT}

  selector:
    matchLabels:
      app: converter-service

  template:
    metadata:
      labels:
        app: converter-service

    spec:
      enableServiceLinks: false
      serviceAccountName: converter-service-account
      imagePullSecrets:
        - name: ${DOCKER_REGISTRY_SECRET_NAME}

      terminationGracePeriodSeconds: 120

      containers:
        - name: converter-service

          image: ${DOCKER_IMAGE_REGISTRY}/${DOCKER_IMAGE_NAMESPACE}/converter-service:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 8002

          envFrom:
            - configMapRef:
                name: converter-config

            - secretRef:
                name: mongodb-secret

            - secretRef:
                name: rabbitmq-secret
            - secretRef:
                name: jwt-secret

          env:
            - name: APP_PORT
              value: "${CONVERTER_APP_PORT}"

            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_PUBLIC_KEY

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_URI

            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URI
            - name: ENABLE_QUEUE_CONSUMER
              value: "false"

          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/mongodb
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000

            capabilities:
              drop:
                - ALL

            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              memory: "${CONVERTER_MEMORY_REQUEST}"
              cpu: "${CONVERTER_CPU_REQUEST}"

            limits:
              memory: "${CONVERTER_MEMORY_LIMIT}"
              cpu: "${CONVERTER_CPU_LIMIT}"

          volumeMounts:
            - name: converter-tmp-root
              mountPath: /tmp
            - name: converter-tmp
              mountPath: /tmp/converter

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

      volumes:
        - name: converter-tmp-root
          emptyDir:
            sizeLimit: 1Gi
        - name: converter-tmp
          emptyDir:
            sizeLimit: 5Gi

      restartPolicy: Always
