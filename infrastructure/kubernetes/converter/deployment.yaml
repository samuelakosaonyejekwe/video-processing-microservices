apiVersion: apps/v1
kind: Deployment

metadata:
  name: converter-service
  namespace: ${K8S_NAMESPACE}

spec:
  replicas: ${CONVERTER_MIN_REPLICA_COUNT}

  selector:
    matchLabels:
      app: converter-service

  template:
    metadata:
      labels:
        app: converter-service

    spec:
      enableServiceLinks: false
      serviceAccountName: converter-service-account
      imagePullSecrets:
        - name: ${DOCKER_REGISTRY_SECRET_NAME}

      containers:
        - name: converter-service

          image: ${DOCKER_IMAGE_REGISTRY}/${DOCKER_IMAGE_NAMESPACE}/converter-service:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 8002

          envFrom:
            - configMapRef:
                name: converter-config

            - secretRef:
                name: mongodb-secret

            - secretRef:
                name: rabbitmq-secret

          env:
            - name: APP_PORT
              value: "${CONVERTER_APP_PORT}"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_URI

            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URI

          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000

            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              memory: "${CONVERTER_MEMORY_REQUEST}"
              cpu: "${CONVERTER_CPU_REQUEST}"

            limits:
              memory: "${CONVERTER_MEMORY_LIMIT}"
              cpu: "${CONVERTER_CPU_LIMIT}"

      restartPolicy: Always
