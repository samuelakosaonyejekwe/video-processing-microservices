apiVersion: v1
kind: ConfigMap

metadata:
  name: auth-config
  namespace: ${K8S_NAMESPACE}

data:

  # =========================================================
  # APPLICATION
  # =========================================================

  APP_NAME: ${AUTH_APP_NAME}

  APP_ENV: ${APP_ENV}

  LOG_LEVEL: ${LOG_LEVEL}

  AUTH_APP_PORT: "${AUTH_APP_PORT}"

  # =========================================================
  # JWT / AUTHENTICATION
  # =========================================================

  JWT_ALGORITHM: ${JWT_ALGORITHM}

  ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES}"

  REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS}"

  PASSWORD_HASH_SCHEME: "${PASSWORD_HASH_SCHEME}"

  # =========================================================
  # POSTGRESQL
  # =========================================================

  POSTGRES_HOST: ${POSTGRES_HOST}

  POSTGRES_PORT: "${POSTGRES_PORT}"

  POSTGRES_DB: ${POSTGRES_DB}

  POSTGRES_USER: ${POSTGRES_USER}

  POSTGRES_SSL_MODE: "${POSTGRES_SSL_MODE}"

  DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE}"

  DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW}"

  DATABASE_POOL_TIMEOUT: "${DATABASE_POOL_TIMEOUT}"

  # =========================================================
  # RABBITMQ
  # =========================================================

  RABBITMQ_HOST: ${RABBITMQ_HOST}

  RABBITMQ_PORT: "${RABBITMQ_PORT}"

  AUTH_EVENTS_QUEUE: "${AUTH_EVENTS_QUEUE}"

  AUTH_RETRY_QUEUE: "${AUTH_RETRY_QUEUE}"

  NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE}

  # =========================================================
  # FRONTEND / CORS
  # =========================================================

  FRONTEND_URL: ${FRONTEND_URL}

  API_BASE_URL: "${API_BASE_URL}"

  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"

  # =========================================================
  # SECURITY
  # =========================================================

  SECURE_COOKIES: "${SECURE_COOKIES}"

  COOKIE_SAMESITE: "${COOKIE_SAMESITE}"

  COOKIE_SECURE: "${COOKIE_SECURE}"

  # =========================================================
  # REDIS
  # =========================================================

  REDIS_HOST: "${REDIS_HOST}"

  REDIS_PORT: "${REDIS_PORT}"

  TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS}"

  RATE_LIMIT_FAIL_CLOSED: "${RATE_LIMIT_FAIL_CLOSED}"

  INTERNAL_SERVICE_TLS_ENABLED: "${INTERNAL_SERVICE_TLS_ENABLED}"

  INTERNAL_TLS_PORT: "${INTERNAL_TLS_PORT}"

  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"

  # =========================================================
  # HEALTHCHECK
  # =========================================================

  HEALTHCHECK_PATH: ${AUTH_HEALTHCHECK_PATH}
