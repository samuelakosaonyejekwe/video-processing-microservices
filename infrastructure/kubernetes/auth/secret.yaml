apiVersion: v1

kind: Secret

metadata:

  name: auth-secret

  namespace: ${K8S_NAMESPACE}

type: Opaque

stringData:

  # =====================================================
  # JWT SECRETS
  # =====================================================

  JWT_SECRET: "${JWT_SECRET}"

  JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"

  JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"

  JWT_ACTIVE_KID: "${JWT_ACTIVE_KID}"

  JWT_ISSUER: "${JWT_ISSUER}"

  JWT_AUDIENCE: "${JWT_AUDIENCE}"

  JWT_ALGORITHM: "${JWT_ALGORITHM}"

  JWT_ACCESS_TOKEN_EXPIRES_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRES_MINUTES}"

  JWT_REFRESH_TOKEN_EXPIRES_DAYS: "${JWT_REFRESH_TOKEN_EXPIRES_DAYS}"

  JWT_REFRESH_TOKEN_SECRET: "${JWT_REFRESH_TOKEN_SECRET}"

  JWT_SESSION_SECRET: "${JWT_SESSION_SECRET}"

  # =====================================================
  # POSTGRES SECRETS
  # =====================================================

  POSTGRES_USER: "${POSTGRES_USER}"

  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  POSTGRES_DB: "${POSTGRES_DB}"

  POSTGRES_HOST: "${POSTGRES_HOST}"

  POSTGRES_PORT: "${POSTGRES_PORT}"

  POSTGRES_SSL_MODE: "${POSTGRES_SSL_MODE}"

  POSTGRES_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE}"
