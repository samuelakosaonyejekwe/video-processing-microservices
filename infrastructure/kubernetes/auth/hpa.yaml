apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: auth-hpa
  namespace: video-converter

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-deployment

  minReplicas: 2

  maxReplicas: 5

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70