apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: notification-hpa
  namespace: ${K8S_NAMESPACE}

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-deployment

  minReplicas: 2

  maxReplicas: 5

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70
