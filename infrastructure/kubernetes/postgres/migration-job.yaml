apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrations
  namespace: ${K8S_NAMESPACE}
  labels:
    app: postgres-migrations
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: postgres-migrations
    spec:
      restartPolicy: OnFailure
      # Uses the default ServiceAccount but never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # TODO: pin by immutable digest (postgres:16-alpine@sha256:...) once a
          # registry-resolved digest is available; patch tag used in the interim.
          image: postgres:16.4-alpine
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="${POSTGRES_PASSWORD}"
              export PGSSLMODE="${POSTGRES_SSL_MODE:-prefer}"
              psql \
                -h "${POSTGRES_HOST}" \
                -p "${POSTGRES_PORT}" \
                -U "${POSTGRES_USER}" \
                -d "${POSTGRES_DB}" \
                -v ON_ERROR_STOP=1 \
                -f /schema/schema.sql
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: POSTGRES_DB
            - name: POSTGRES_SSL_MODE
              value: prefer
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: schema
              mountPath: /schema
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          configMap:
            name: postgres-schema
        - name: tmp
          emptyDir: {}
