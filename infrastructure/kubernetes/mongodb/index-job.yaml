apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-index-setup
  namespace: ${K8S_NAMESPACE}
  labels:
    app: mongodb-index-setup
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: mongodb-index-setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ensure-indexes
          image: ${DOCKER_IMAGE_REGISTRY}/${DOCKER_IMAGE_NAMESPACE}/gateway-service:${IMAGE_TAG}
          command:
            - python
            - -c
            - |
              from app.database.job_repository import ensure_job_indexes
              from shared.outbox.upload_outbox import ensure_upload_outbox_indexes
              from app.database.mongo_client import get_database
              ensure_job_indexes()
              database = get_database()
              if database is not None:
                  ensure_upload_outbox_indexes(database)
              print("MongoDB job and outbox indexes ensured")
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secret
            - secretRef:
                name: mongodb-secret
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_URI
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
