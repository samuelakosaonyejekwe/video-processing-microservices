apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-index-setup
  namespace: ${K8S_NAMESPACE}
  labels:
    app: mongodb-index-setup
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ensure-indexes
          image: ${DOCKER_IMAGE_REGISTRY}/${DOCKER_IMAGE_NAMESPACE}/gateway-service:${IMAGE_TAG}
          command:
            - python
            - -c
            - |
              from app.database.job_repository import ensure_job_indexes
              ensure_job_indexes()
              print("MongoDB job indexes ensured")
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secret
