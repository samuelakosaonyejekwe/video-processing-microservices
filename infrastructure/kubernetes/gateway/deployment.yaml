apiVersion: apps/v1

kind: Deployment

metadata:
  name: gateway-deployment
  namespace: video-converter

spec:

  replicas: 2

  selector:
    matchLabels:
      app: gateway

  template:

    metadata:
      labels:
        app: gateway

    spec:

      containers:

        - name: gateway

          image: your-dockerhub-username/gateway-service:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: gateway-config

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"