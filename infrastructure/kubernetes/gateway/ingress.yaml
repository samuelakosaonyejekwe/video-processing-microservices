apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: ${GATEWAY_INGRESS_NAME}

  namespace: ${K8S_NAMESPACE}

  annotations:

    kubernetes.io/ingress.class: ${INGRESS_CLASS_NAME}

    alb.ingress.kubernetes.io/scheme: ${ALB_SCHEME}

    alb.ingress.kubernetes.io/target-type: ${ALB_TARGET_TYPE}

    alb.ingress.kubernetes.io/listen-ports: ${ALB_LISTEN_PORTS}

spec:

  ingressClassName: ${INGRESS_CLASS_NAME}

  rules:

    - host: ${DOMAIN_NAME}

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: ${GATEWAY_SERVICE_NAME}

                port:

                  number: ${GATEWAY_SERVICE_PORT}
