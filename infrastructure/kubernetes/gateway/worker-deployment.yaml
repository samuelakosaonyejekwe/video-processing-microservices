apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-worker
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ${GATEWAY_WORKER_POD_LABEL}
    service: gateway-service
    component: queue-worker
    environment: ${APP_ENV}

spec:
  replicas: ${GATEWAY_WORKER_REPLICAS}
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: ${GATEWAY_WORKER_POD_LABEL}

  template:
    metadata:
      labels:
        app: ${GATEWAY_WORKER_POD_LABEL}
        service: gateway-service
        component: queue-worker
        environment: ${APP_ENV}

    spec:
      serviceAccountName: gateway-service-account
      imagePullSecrets:
        - name: ${DOCKER_REGISTRY_SECRET_NAME}

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 60

      containers:
        - name: gateway-worker
          image: ${DOCKER_IMAGE_REGISTRY}/${DOCKER_IMAGE_NAMESPACE}/gateway-service:${IMAGE_TAG}
          imagePullPolicy: Always
          command: ["python", "-m", "app.run_worker"]

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secret
            - secretRef:
                name: mongodb-secret

          env:
            - name: ENABLE_QUEUE_CONSUMER
              value: "true"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: APP_ENV
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_PUBLIC_KEY
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_AUDIENCE
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URI
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_URI
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"

          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/worker-ready"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/worker-ready"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 2Gi

      restartPolicy: Always
