apiVersion: batch/v1
kind: CronJob
metadata:
  name: s3-orphan-cleanup
  namespace: ${K8S_NAMESPACE}
  labels:
    app: s3-orphan-cleanup
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: ${DOCKER_IMAGE_REGISTRY}/${DOCKER_IMAGE_NAMESPACE}/gateway-service:${IMAGE_TAG}
              command:
                - python
                - -m
                - app.scripts.cleanup_orphan_s3
              envFrom:
                - configMapRef:
                    name: gateway-config
                - secretRef:
                    name: gateway-secret
