apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: common-hpa
  namespace: video-converter

spec:

  minReplicas: 1

  maxReplicas: 5

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: 70