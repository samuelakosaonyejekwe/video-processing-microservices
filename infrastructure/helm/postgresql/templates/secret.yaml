apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: "{{ .Values.postgresql.auth.username | default "postgres" }}"
  POSTGRES_PASSWORD: "{{ .Values.postgresql.auth.password | default "postgres" }}"
  POSTGRES_DB: "{{ .Values.postgresql.auth.database | default "video_to_audio_converter" }}"
  POSTGRES_HOST: "{{ .Values.postgresql.host | default "postgres" }}"
  POSTGRES_PORT: "{{ .Values.service.port | default "5432" }}"
  POSTGRES_SSL_MODE: "{{ .Values.postgresql.sslMode | default "prefer" }}"
  POSTGRES_URI: "postgresql://{{ .Values.postgresql.auth.username | default "postgres" }}:{{ .Values.postgresql.auth.password | default "postgres" }}@{{ .Values.postgresql.host | default "postgres" }}:{{ .Values.service.port | default "5432" }}/{{ .Values.postgresql.auth.database | default "video_to_audio_converter" }}?sslmode={{ .Values.postgresql.sslMode | default "prefer" }}"
