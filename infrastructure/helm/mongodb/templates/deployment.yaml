apiVersion: apps/v1

kind: Deployment

metadata:

  name: mongodb

  labels:

    app: mongodb

spec:

  replicas: {{ .Values.replicaCount }}

  selector:

    matchLabels:

      app: mongodb

  template:

    metadata:

      labels:

        app: mongodb

      annotations:

        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}

    spec:

      securityContext:

        fsGroup: 999

      containers:

        - name: mongodb

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:

            runAsNonRoot: true

            runAsUser: 999

            runAsGroup: 999

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: false

            capabilities:

              drop:
                - ALL

          ports:

            - name: mongodb

              containerPort: {{ .Values.service.port }}

              protocol: TCP

          env:

            - name: MONGO_INITDB_ROOT_USERNAME

              valueFrom:

                secretKeyRef:

                  name: mongodb-secret

                  key: MONGO_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: mongodb-secret

                  key: MONGO_PASSWORD

            - name: MONGO_INITDB_DATABASE

              valueFrom:

                secretKeyRef:

                  name: mongodb-secret

                  key: MONGO_DATABASE

            - name: MONGO_HOST

              valueFrom:

                secretKeyRef:

                  name: mongodb-secret

                  key: MONGO_HOST

            - name: MONGO_PORT

              valueFrom:

                secretKeyRef:

                  name: mongodb-secret

                  key: MONGO_PORT

            - name: MONGO_AUTH_SOURCE

              valueFrom:

                secretKeyRef:

                  name: mongodb-secret

                  key: MONGO_AUTH_SOURCE

          resources:

            requests:

              cpu: {{ .Values.resources.requests.cpu | quote }}

              memory: {{ .Values.resources.requests.memory | quote }}

            limits:

              cpu: {{ .Values.resources.limits.cpu | quote }}

              memory: {{ .Values.resources.limits.memory | quote }}

          livenessProbe:

            exec:

              command:

                - /bin/sh

                - -c

                - >
                  mongosh
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "db.adminCommand('ping')"

            initialDelaySeconds: 30

            periodSeconds: 10

            timeoutSeconds: 5

            successThreshold: 1

            failureThreshold: 6

          readinessProbe:

            exec:

              command:

                - /bin/sh

                - -c

                - >
                  mongosh
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "db.adminCommand('ping')"

            initialDelaySeconds: 10

            periodSeconds: 10

            timeoutSeconds: 5

            successThreshold: 1

            failureThreshold: 6

          startupProbe:

            exec:

              command:

                - /bin/sh

                - -c

                - >
                  mongosh
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "db.adminCommand('ping')"

            initialDelaySeconds: 10

            periodSeconds: 10

            timeoutSeconds: 5

            successThreshold: 1

            failureThreshold: 30

          volumeMounts:

            - name: mongodb-storage

              mountPath: /data/db

      volumes:

        - name: mongodb-storage

          persistentVolumeClaim:

            claimName: mongodb-pvc