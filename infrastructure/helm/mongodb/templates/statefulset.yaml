apiVersion: apps/v1
kind: StatefulSet

metadata:

  name: mongodb

  labels:

    app.kubernetes.io/name: mongodb

    app.kubernetes.io/managed-by: Helm

spec:

  serviceName: mongodb

  replicas: {{ .Values.replicaCount }}

  selector:

    matchLabels:

      app: mongodb

  template:

    metadata:

      labels:

        app: mongodb

      annotations:

        prometheus.io/scrape: "true"

        prometheus.io/port: "27017"

    spec:

      securityContext:

        runAsNonRoot: true

        runAsUser: 999

        fsGroup: 999

        fsGroupChangePolicy: OnRootMismatch

      initContainers:

        - name: volume-permissions

          image: busybox:1.36

          command: ["sh", "-c", "chown -R 999:999 /data/db"]

          volumeMounts:

            - name: mongodb-storage

              mountPath: /data/db

          securityContext:

            runAsUser: 0

      containers:

        - name: mongodb

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:

            runAsNonRoot: true

            runAsUser: 999

            allowPrivilegeEscalation: false

          ports:

            - containerPort: 27017

          env:

            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_PASSWORD

            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_DATABASE

          volumeMounts:

            - name: mongodb-storage

              mountPath: /data/db

          resources:

            {{- toYaml .Values.resources | nindent 12 }}

          livenessProbe:

            tcpSocket:

              port: 27017

            initialDelaySeconds: 30

          readinessProbe:

            tcpSocket:

              port: 27017

            initialDelaySeconds: 10

          startupProbe:

            tcpSocket:

              port: 27017

            failureThreshold: 30

            periodSeconds: 10

      volumes:

        - name: mongodb-storage

          persistentVolumeClaim:

            claimName: mongodb-pvc