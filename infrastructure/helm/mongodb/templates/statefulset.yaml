apiVersion: apps/v1
kind: StatefulSet

metadata:

  name: mongodb

  labels:

    app.kubernetes.io/name: mongodb

    app.kubernetes.io/managed-by: Helm

spec:

  serviceName: mongodb

  replicas: {{ .Values.replicaCount }}

  selector:

    matchLabels:

      app: mongodb

  template:

    metadata:

      labels:

        app: mongodb

      annotations:

        prometheus.io/scrape: "true"

        prometheus.io/port: "27017"

    spec:

      securityContext:

        runAsNonRoot: true

        runAsUser: 1000

      containers:

        - name: mongodb

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:

            - containerPort: 27017

          envFrom:

            - secretRef:

                name: mongodb-secret

          volumeMounts:

            - name: mongodb-storage

              mountPath: /data/db

          resources:

            {{- toYaml .Values.resources | nindent 12 }}

          livenessProbe:

            tcpSocket:

              port: 27017

            initialDelaySeconds: 30

          readinessProbe:

            tcpSocket:

              port: 27017

            initialDelaySeconds: 10

          startupProbe:

            tcpSocket:

              port: 27017

            failureThreshold: 30

            periodSeconds: 10

      volumes:

        - name: mongodb-storage

          persistentVolumeClaim:

            claimName: mongodb-pvc